<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contractor Job Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; position: relative; z-index: 1; }
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://res.cloudinary.com/dvrljjtdr/image/upload/v1787707522/background_ijjw1z.jpg');
            background-size: cover; background-position: center;
            opacity: 0.77; z-index: -1;
        }
        .bg-white-77 { background-color: rgba(255, 255, 255, 0.77); }
        .address-display { white-space: pre-wrap; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen">
    <div id="app" class="w-full max-w-3xl mx-auto p-4 md:my-8">
        
        <div id="login-section" class="bg-white-77 rounded-2xl shadow-xl p-6 md:p-10">
            <img src="https://res.cloudinary.com/dvrljjtdr/image/upload/v1761924705/Gemini_Generated_Image_bov797bov797bov7_ooqpjf.png" alt="Company Logo" class="w-80 mx-auto mb-6">
            <h2 class="text-3xl font-bold text-gray-800 mb-8 text-center">Contractor Login</h2>
            <div class="mb-4">
                <label for="username" class="block text-gray-700 text-sm font-bold mb-2">Username (Email):</label>
                <input type="email" id="username" class="shadow-sm appearance-none border rounded-lg w-full py-3 px-4 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent">
            </div>
            <div class="mb-6">
                <label for="password" class="block text-gray-700 text-sm font-bold mb-2">Password:</label>
                <input type="password" id="password" class="shadow-sm appearance-none border rounded-lg w-full py-3 px-4 text-gray-700 mb-3 leading-tight focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent">
            </div>
            <button id="login-button" class="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg focus:outline-none focus:shadow-outline w-full transition duration-300 ease-in-out text-lg">Login</button>
            <p id="login-message" class="text-red-500 text-xs italic mt-4 text-center"></p>
        </div>

        <div id="jobs-section" class="hidden p-4 md:p-8 md:bg-white-77 md:rounded-2xl md:shadow-xl">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-3xl font-bold text-gray-800">Available Jobs</h2>
                <button id="logout-button" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-medium py-2 px-4 rounded-lg focus:outline-none focus:shadow-outline transition duration-300 ease-in-out text-sm">Logout</button>
            </div>
            
            <div class="bg-amber-50 border-l-4 border-amber-500 text-amber-900 p-5 mb-6 rounded-xl flex flex-col md:flex-row justify-between items-center shadow-sm" role="alert">
                <div class="mb-4 md:mb-0 md:mr-6 text-center md:text-left">
                    <p class="font-bold text-amber-700 text-lg mb-1">IMPORTANT UPDATE:</p>
                    <p class="font-medium text-base leading-snug">
                        All vehicle details must be digitally inspected to receive payment. Snap photos using the AI Scanner after each detail is complete.
                    </p>
                </div>
            </div>
            
            <p id="no-jobs-message" class="text-gray-600 text-center hidden">No jobs available at the moment.</p>
            <div id="jobs-list" class="space-y-6"></div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'https://michie-detailing-backend.onrender.com';
        const QUOTE_PHOTO_HOST = 'https://quote.michieauto.com';
        const API_URL_SMS = 'https://client-notifications.onrender.com/send-sms';

        const loginSection = document.getElementById('login-section');
        const jobsSection = document.getElementById('jobs-section');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const loginButton = document.getElementById('login-button');
        const loginMessage = document.getElementById('login-message');
        const logoutButton = document.getElementById('logout-button');
        const jobsList = document.getElementById('jobs-list');
        const noJobsMessage = document.getElementById('no-jobs-message');

        let authToken = localStorage.getItem('authToken');

        function formatPhotoUrl(url) {
            if (!url) return '';
            if (url.startsWith('http://') || url.startsWith('https://')) return url;
            return QUOTE_PHOTO_HOST + (url.startsWith('/') ? '' : '/') + url;
        }

        function updateUI() {
            if (authToken) {
                loginSection.classList.add('hidden');
                jobsSection.classList.remove('hidden');
                fetchJobs();
            } else {
                loginSection.classList.remove('hidden');
                jobsSection.classList.add('hidden');
                jobsList.innerHTML = '';
                noJobsMessage.classList.add('hidden');
            }
        }

        loginButton.addEventListener('click', async () => {
            const username = usernameInput.value;
            const password = passwordInput.value;
            try {
                const response = await fetch(`${API_BASE_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password }),
                });
                const data = await response.json();
                if (response.ok) {
                    authToken = data.token;
                    localStorage.setItem('authToken', authToken);
                    localStorage.setItem('contractorEmail', username); 
                    loginMessage.textContent = '';
                    updateUI();
                } else {
                    loginMessage.textContent = data.message || 'Login failed. Please check credentials.';
                }
            } catch (error) {
                loginMessage.textContent = 'Login network error.';
            }
        });

        logoutButton.addEventListener('click', () => {
            authToken = null;
            localStorage.removeItem('authToken');
            localStorage.removeItem('contractorEmail');
            updateUI();
        });

        function formatAppointmentDate(dateString) {
            if (!dateString || dateString === "N/A") return "N/A";
            const parts = String(dateString).split('-');
            return parts.length === 3 ? `${parts[1]}-${parts[2]}-${parts[0]}` : dateString;
        }

        function formatAppointmentTime(timeStr) {
            if (!timeStr || timeStr === 'N/A') return 'N/A';
            const match = String(timeStr).trim().match(/^(\d{1,2}):(\d{2})(?::\d{2})?\s*([AaPp][Mm])?$/);
            if (!match) return timeStr;
            let hours = parseInt(match[1], 10);
            let minutes = match[2];
            let suffix = match[3] ? match[3].toUpperCase() : (hours >= 12 ? 'PM' : 'AM');
            hours = hours % 12 || 12;
            return `${hours}:${minutes} ${suffix}`;
        }

        async function fetchJobs() {
            if (!authToken) return;
            jobsList.innerHTML = ''; 
            noJobsMessage.textContent = 'Loading jobs...';
            noJobsMessage.classList.remove('hidden');

            try {
                const response = await fetch(`${API_BASE_URL}/jobs`, {
                    headers: { 'Authorization': `Bearer ${authToken}`, 'Content-Type': 'application/json' },
                });

                if (response.status === 401) {
                    logoutButton.click();
                    return;
                }

                const data = await response.json();
                if (response.ok) renderJobs(data);
                else noJobsMessage.textContent = data.message || 'Error fetching jobs.';
            } catch (error) {
                noJobsMessage.textContent = 'Error connecting to database.';
            }
        }

        function renderJobs(jobs) {
            jobsList.innerHTML = '';
            let renderedJobCount = 0;
            const contractorEmail = localStorage.getItem('contractorEmail');

            if (!Array.isArray(jobs)) {
                noJobsMessage.textContent = "Error: Invalid data received.";
                return;
            }

            jobs.forEach(job => {
                if (!job || !job.status) return;
                
                let showJob = (job.status === 'pending') || (job.status === 'accepted' && job.contractor_id_field === contractorEmail);
                if (!showJob) return;

                const jobCard = document.createElement('div');
                jobCard.className = 'bg-white-77 rounded-xl shadow-lg border border-gray-200 overflow-hidden flex flex-col';

                const jobYear = String(job.vehicle_year || job.year || '').trim();
                const jobMake = String(job.vehicle_make || job.make || '').trim();
                const jobModel = String(job.vehicle_model || job.model || '').trim();
                let mainTitle = [jobYear, jobMake, jobModel].filter(s => s && s !== "N/A").join(' ').trim() || job.deal_name || "Detail Job";

                let payDisplay = job.pay && job.pay !== "N/A" ? job.pay : (job.contractor_expense ? `$${parseFloat(job.contractor_expense).toFixed(2)} + TIPS` : '$120.00 + TIPS');

                // 1. Customer Notes
                let jobNotesHTML = '';
                if (job.job_notes && job.job_notes.trim() !== "N/A") {
                    jobNotesHTML = `
                        <div class="mt-4 border-t pt-4 border-gray-200">
                            <h4 class="text-xs uppercase text-gray-500 font-semibold mb-2">Customer Instructions</h4>
                            <div class="text-sm text-gray-700 bg-yellow-50 border border-yellow-200 p-3 rounded-lg">
                                <p class="whitespace-pre-wrap">${job.job_notes.trim()}</p>
                            </div>
                        </div>`;
                }

                // 2. Private AI Work Order (No customer data/greetings)
                let aiWorkOrderHTML = '';
                const aiNotes = String(job.ai_notes || '').trim();
                if (aiNotes && aiNotes !== "N/A" && aiNotes !== "undefined" && aiNotes !== "null") {
                    aiWorkOrderHTML = `
                        <div class="mt-4 border-t pt-4 border-gray-200">
                            <div class="flex items-center gap-2 mb-2">
                                <span class="bg-blue-600 text-white text-[10px] font-black uppercase px-2 py-0.5 rounded">AI Work Order</span>
                                <h4 class="text-xs uppercase text-blue-700 font-bold">Scope & Pay Justification</h4>
                            </div>
                            <div class="text-sm text-blue-950 bg-blue-50/90 border border-blue-200 p-4 rounded-xl leading-relaxed whitespace-pre-wrap font-medium">${aiNotes}</div>
                        </div>`;
                }

                // 3. Before Photos (Visible upon Accept)
                let beforePhotosHTML = '';
                if (job.status === 'accepted' && job.before_photos) {
                    try {
                        const photos = typeof job.before_photos === 'string' ? JSON.parse(job.before_photos) : job.before_photos;
                        if (Array.isArray(photos) && photos.length > 0) {
                            beforePhotosHTML = `
                                <div class="mt-4 border-t pt-4 border-gray-200">
                                    <h4 class="text-xs uppercase text-blue-600 font-semibold mb-3">AI Scan - Before Photos</h4>
                                    <div class="flex overflow-x-auto space-x-3 pb-3 no-scrollbar snap-x">
                            `;
                            photos.forEach(url => {
                                const resolvedUrl = formatPhotoUrl(url);
                                beforePhotosHTML += `<img src="${resolvedUrl}" class="h-28 w-28 object-cover rounded-xl shadow-sm border border-slate-200 flex-shrink-0 snap-center cursor-pointer" onclick="window.open('${resolvedUrl}', '_blank')">`;
                            });
                            beforePhotosHTML += `</div></div>`;
                        }
                    } catch(e) {}
                }

                let html = '';
                if (job.status === 'pending') {
                    html = `
                        <div class="p-5">
                            <h3 class="text-xl font-semibold text-gray-900 mb-3">${mainTitle}</h3>
                            <div class="space-y-2 mb-4 text-gray-700">
                                ${job.service_level ? `<p><strong>Service:</strong> ${job.service_level}</p>` : ''}
                                ${job.zip_code ? `<p><strong>Zip:</strong> ${job.zip_code}</p>` : ''}
                                ${job.appointment_date ? `<p><strong>Date:</strong> ${formatAppointmentDate(job.appointment_date)}</p>` : ''}
                                ${job.appointment_time ? `<p><strong>Time:</strong> ${formatAppointmentTime(job.appointment_time)}</p>` : ''}
                            </div>
                            ${jobNotesHTML}
                            ${aiWorkOrderHTML}
                        </div>
                        <div class="bg-gray-50 px-5 py-4 border-t border-gray-100 space-y-3">
                            <div class="w-full bg-green-600 text-white font-bold py-3 px-4 rounded-lg text-center text-lg">${payDisplay}</div>
                            <div class="flex space-x-3">
                                <button data-job-id="${job.id}" class="accept-button w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg">Accept Job</button>
                                <button data-job-id="${job.id}" class="decline-button w-full bg-red-500 hover:bg-red-600 text-white font-bold py-3 rounded-lg">Decline</button>
                            </div>
                        </div>`;
                } else {
                    html = `
                        <div class="p-4 bg-green-50 border-b border-green-200"><h3 class="text-lg font-bold text-green-800">Job Claimed</h3></div>
                        <div class="p-5 flex-grow">
                            <div><h4 class="text-xs uppercase text-gray-500 font-semibold mb-1">Vehicle</h4><p class="text-2xl font-bold text-gray-800">${mainTitle}</p></div>
                            <div class="mt-4 border-t pt-4 border-gray-200">
                                <h4 class="text-xs uppercase text-gray-500 font-semibold mb-2">Schedule & Location</h4>
                                <div class="text-gray-700 space-y-1">
                                    <p class="font-medium">${formatAppointmentDate(job.appointment_date)} at ${formatAppointmentTime(job.appointment_time)}</p>
                                    <p class="text-blue-600 font-medium">${job.customer_address || job.zip_code}</p>
                                    <p class="text-gray-600">Client: ${job.customer_name || 'N/A'}</p>
                                </div>
                            </div>
                            ${jobNotesHTML}
                            ${aiWorkOrderHTML}
                            ${beforePhotosHTML}
                            <div class="mt-4 border-t pt-4 border-gray-200">
                                <h4 class="text-xs uppercase text-gray-500 font-semibold mb-2">Guaranteed Contractor Pay</h4>
                                <div class="bg-green-600 text-white text-lg font-bold py-3 px-5 rounded-lg text-center">${payDisplay}</div>
                            </div>
                            <div class="mt-5">
                                <a href="https://inspection.michieauto.com/?job_id=${job.id}&v-year=${encodeURIComponent(jobYear)}&v-make=${encodeURIComponent(jobMake)}&v-model=${encodeURIComponent(jobModel)}&s-level=${encodeURIComponent(job.service_level || '')}" target="_blank" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-4 rounded-xl flex items-center justify-center text-lg shadow-md transition">
                                    Start Detail Inspection
                                </a>
                            </div>
                        </div>`;
                }

                jobCard.innerHTML = html;
                jobsList.appendChild(jobCard);
                renderedJobCount++;
            });

            noJobsMessage.classList.toggle('hidden', renderedJobCount > 0);
            if (renderedJobCount === 0) noJobsMessage.textContent = "No jobs available at the moment.";

            document.querySelectorAll('.accept-button').forEach(btn => btn.addEventListener('click', (e) => handleJobAction(e.target.dataset.jobId, 'accept')));
            document.querySelectorAll('.decline-button').forEach(btn => btn.addEventListener('click', (e) => handleJobAction(e.target.dataset.jobId, 'decline')));
        }

        async function handleJobAction(jobId, action) {
            try {
                const response = await fetch(`${API_BASE_URL}/jobs/${jobId}/${action}`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${authToken}`, 'Content-Type': 'application/json' },
                });
                if (response.ok) fetchJobs();
                else alert('Action failed.');
            } catch (error) {
                alert('Network error.');
            }
        }

        document.addEventListener('DOMContentLoaded', updateUI);
    </script>
</body>
</html>
